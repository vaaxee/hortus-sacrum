<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<!-- Hortus Sacrum, direction grecque, nuit : monogramme marial (Auspice Maria, A et M entrelacés) en or,
	     sous une arche d'outremer vif ; fond d'outremer profond ; tesselles cobalt en accent. -->
	<rect width="1024" height="1024" fill="#0E0C52"/>
	<radialGradient id="coupole" cx="512" cy="470" r="360" gradientUnits="userSpaceOnUse">
		<stop offset="0" stop-color="#2B27C4"/>
		<stop offset="1" stop-color="#1F1CA6"/>
	</radialGradient>
	<!-- arche (coupole) -->
	<path d="M232 852V492a280 280 0 0 1 560 0v360Z" fill="url(#coupole)"/>
	<path d="M232 852V492a280 280 0 0 1 560 0v360Z" fill="none" stroke="#E0BF6C" stroke-width="20"/>
	<path d="M266 832V492a246 246 0 0 1 492 0v340" fill="none" stroke="#E0BF6C" stroke-width="6"/>
	<path d="M196 852h632" stroke="#E0BF6C" stroke-width="20"/>
	<!-- tesselles cobalt le long de l'arche -->
	<g fill="#6F9DF2">
		<rect x="502" y="164" width="20" height="20" transform="rotate(45 512 174)"/>
		<rect x="686" y="224" width="16" height="16" transform="rotate(45 694 232)"/>
		<rect x="322" y="224" width="16" height="16" transform="rotate(45 330 232)"/>
		<rect x="804" y="377" width="13" height="13" transform="rotate(45 811 383)"/>
		<rect x="207" y="377" width="13" height="13" transform="rotate(45 213 383)"/>
		<rect x="824" y="498" width="11" height="11" transform="rotate(45 830 503)"/>
		<rect x="189" y="498" width="11" height="11" transform="rotate(45 194 503)"/>
	</g>	<!-- petite croix au sommet -->
	<path d="M512 300v84M484 330h56" stroke="#E0BF6C" stroke-width="16" stroke-linecap="square"/>
	<!-- monogramme : M, et le A qui s'élève en son milieu -->
	<g fill="none" stroke="#E0BF6C" stroke-width="34" stroke-linecap="butt" stroke-linejoin="miter">
		<!-- M : jambages droits, pointe centrale remontée -->
		<path d="M370 770V474L512 612L654 474V770"/>
		<!-- A : sommet au-dessus du M, traverse sous la pointe -->
		<path d="M430 770L512 424L594 770"/>
		<path d="M455 676h114"/>
		<!-- empattements des jambages du M -->
		<path d="M336 770h68M620 770h68"/>
	</g></svg>
